project:
  type: book
  output-dir: _book

book:
  title: "MiniMind Parallelism Book"
  author: "ANKer661"
  description: "从 MiniMind 出发，理解并实现大模型并行训练策略。"
  chapters:
    - index.qmd
    - part: "从 MiniMind 到 Tensor、Sequence 与 Vocab Parallelism"
      chapters:
        - src/tensor_parallel.qmd
        - src/sequence_parallel.qmd
        - src/sequence_parallel_optimization.qmd
        - src/vocab_parallel.qmd
        - src/unified_benchmark.qmd
    - part: "Pipeline Parallelism：沿深度方向切分模型"
      chapters:
        - src/pipeline_parallel.qmd
  repo-url: https://github.com/ANKer661/minimind-tron
  repo-branch: main
  repo-subdir: book
  repo-actions: [edit, issue]
  search: true
  comments:
    giscus:
      repo: ANKer661/minimind-tron
      repo-id: R_kgDOSsJaIA
      category: Announcements
      category-id: DIC_kwDOSsJaIM4DC1Es
      mapping: pathname
      reactions-enabled: true
      input-position: top
      theme: light
      language: zh-CN
      loading: lazy

lang: zh
number-sections: true

format:
  html:
    theme: cosmo
    syntax-highlighting: atom-one
    css: styles.css
    toc: true
    code-copy: true
    code-overflow: wrap
    html-math-method: mathjax
    grid:
      body-width: 1100px
